<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex — a better way to read Fandom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#14131a;
    --murk:#1f1d26;
    --murk-2:#2b2833;
    --line: rgba(234,228,210,0.09);
    --line-strong: rgba(234,228,210,0.18);
    --bone:#eae4d2;
    --bone-dim:#a49d8d;
    --toxin:#93b24c;
    --ember:#c1502f;
    --rift:#8271b5;
    --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
    --radius: 3px;
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--void); color:var(--bone);
    font-family:'Newsreader', serif; font-size:17px; line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--toxin); color:var(--void); }
  a{ color:inherit; }
  img{ max-width:100%; }
  button{ font-family:inherit; }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace; font-size:11.5px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--toxin);
  }
  .mono{ font-family:'IBM Plex Mono', monospace; }

  /* ---------------- Header ---------------- */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:14px 28px;
    background:rgba(20,19,26,0.9); backdrop-filter: blur(10px);
    border-bottom:1px solid var(--line);
  }
  .wordmark{
    font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:16px;
    text-decoration:none; display:flex; align-items:center; gap:8px; cursor:pointer; background:none; border:none; color:var(--bone);
  }
  .wordmark .glyph{ color:var(--toxin); }
  header .wiki-search{ flex:1; max-width:420px; position:relative; display:none; }
  header .wiki-search.show{ display:block; }
  header .wiki-search input{
    width:100%; background:var(--murk); border:1px solid var(--line-strong); color:var(--bone);
    padding:9px 14px; border-radius:100px; font-family:'Newsreader',serif; font-size:14.5px;
  }
  header .wiki-search input:focus{ outline:none; border-color:var(--toxin); }
  header .current-wiki{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--bone-dim);
    text-decoration:none; white-space:nowrap;
  }
  header .current-wiki:hover{ color:var(--toxin); }
  .suggest-panel{
    position:absolute; top:calc(100% + 6px); left:0; right:0;
    background:var(--murk); border:1px solid var(--line-strong); border-radius:var(--radius);
    box-shadow:var(--shadow); max-height:340px; overflow:auto; z-index:60; display:none;
  }
  .suggest-panel.show{ display:block; }
  .suggest-item{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--bone);
    padding:10px 14px; font-family:'Newsreader',serif; font-size:14.5px; cursor:pointer;
    border-bottom:1px solid var(--line);
  }
  .suggest-item:last-child{ border-bottom:none; }
  .suggest-item:hover, .suggest-item.hi{ background:var(--murk-2); color:var(--toxin); }
  .suggest-item small{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--bone-dim); margin-top:2px; }

  main{ min-height:calc(100vh - 60px); }

  /* ---------------- Home ---------------- */
  .home-hero{
    max-width:720px; margin:0 auto; padding:110px 24px 60px; text-align:center;
  }
  .home-hero h1{
    font-family:'Bricolage Grotesque', sans-serif; font-weight:800;
    font-size:clamp(40px, 7vw, 64px); line-height:1.02; margin:0 0 14px; letter-spacing:-.01em;
  }
  .home-hero h1 span{ color:var(--toxin); }
  .home-hero p.sub{ color:var(--bone-dim); font-size:17px; max-width:480px; margin:0 auto 40px; }
  .home-search{ position:relative; max-width:560px; margin:0 auto; }
  .home-search input{
    width:100%; background:var(--murk); border:1px solid var(--line-strong); color:var(--bone);
    padding:18px 24px; border-radius:100px; font-family:'Newsreader',serif; font-size:18px;
  }
  .home-search input:focus{ outline:none; border-color:var(--toxin); box-shadow:0 0 0 3px rgba(147,178,76,0.15); }
  .home-search .hint{
    margin-top:12px; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--bone-dim);
  }
  .home-search .hint kbd{
    font-family:'IBM Plex Mono',monospace; background:var(--murk-2); border:1px solid var(--line-strong);
    border-radius:4px; padding:1px 6px; font-size:10.5px;
  }
  .home-status{
    max-width:560px; margin:16px auto 0; font-family:'IBM Plex Mono',monospace; font-size:12.5px;
    color:var(--ember); text-align:left; padding:10px 16px; background:var(--murk); border-radius:var(--radius);
    border:1px solid var(--line-strong); display:none;
  }
  .home-status.show{ display:block; }
  .home-status.loading{ color:var(--bone-dim); }

  .quickpicks{ max-width:920px; margin:20px auto 0; padding:0 24px 100px; }
  .quickpicks .eyebrow{ display:block; text-align:center; margin-bottom:20px; }
  .pick-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px;
  }
  .pick-card{
    text-align:left; background:var(--murk); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 18px; cursor:pointer; color:var(--bone);
    transition:border-color .15s, transform .15s;
  }
  .pick-card:hover, .pick-card:focus-visible{ border-color:var(--toxin); transform:translateY(-2px); outline:none; }
  .pick-card .name{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:15.5px; margin-bottom:4px; }
  .pick-card .sub{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bone-dim); }

  .home-footnote{
    max-width:560px; margin:0 auto; padding:0 24px 60px; text-align:center;
    font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--bone-dim); line-height:1.8;
  }
  .home-footnote a{ color:var(--toxin); text-decoration:none; }

  /* ---------------- Wiki view ---------------- */
  .wiki-hero{
    padding:56px 28px 36px; border-bottom:1px solid var(--line);
    background: radial-gradient(50% 60% at 85% 0%, rgba(130,113,181,0.14), transparent 60%), var(--void);
  }
  .wiki-hero-inner{ max-width:900px; margin:0 auto; }
  .breadcrumb{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--bone-dim); margin-bottom:16px; }
  .breadcrumb a{ text-decoration:none; color:var(--bone-dim); } .breadcrumb a:hover{ color:var(--toxin); }
  .wiki-title{ font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(34px,6vw,58px); line-height:1.02; margin:0; }

  .layout{
    max-width:1180px; margin:0 auto; padding:44px 28px 120px;
    display:grid; grid-template-columns:200px minmax(0,1fr) 300px; gap:44px; align-items:start;
  }
  .toc{ position:sticky; top:80px; font-family:'IBM Plex Mono',monospace; font-size:12px; }
  .toc .eyebrow{ display:block; margin-bottom:12px; }
  .toc a{
    display:block; text-decoration:none; color:var(--bone-dim); padding:5px 0 5px 11px;
    border-left:1px solid var(--line); line-height:1.4;
  }
  .toc a:hover{ color:var(--toxin); border-color:var(--toxin); }
  .toc a.lvl3{ padding-left:22px; font-size:11px; opacity:.85; }

  #article{ min-width:0; }
  #article h2{
    font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:27px;
    margin:44px 0 14px; padding-top:8px; border-top:1px solid var(--line); scroll-margin-top:80px;
  }
  #article h2:first-child{ margin-top:0; border-top:none; }
  #article h3{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:19px; color:var(--toxin); margin:26px 0 10px; scroll-margin-top:80px; }
  #article p{ margin:0 0 17px; }
  #article a{ color:var(--toxin); text-decoration:none; border-bottom:1px solid rgba(147,178,76,0.35); }
  #article a:hover{ border-color:var(--toxin); }
  #article a.new{ color:var(--ember); border-color:rgba(193,80,47,0.35); }
  #article ul, #article ol{ margin:0 0 17px; padding-left:22px; }
  #article li{ margin-bottom:6px; }
  #article table:not(.infobox):not(.portable-infobox){
    width:100%; border-collapse:collapse; margin:20px 0; font-size:14.5px;
    background:var(--murk); border:1px solid var(--line);
  }
  #article table:not(.infobox):not(.portable-infobox) th,
  #article table:not(.infobox):not(.portable-infobox) td{
    border:1px solid var(--line); padding:8px 12px; text-align:left;
  }
  #article table:not(.infobox):not(.portable-infobox) th{ background:var(--murk-2); font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--bone-dim); }
  #article figure, #article .thumb{
    margin:24px 0; background:var(--murk); border:1px solid var(--line); border-radius:var(--radius); padding:14px;
  }
  #article .thumb img{ border-radius:2px; }
  #article .thumbcaption, #article figcaption{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--bone-dim); margin-top:10px; }
  #article blockquote{
    margin:26px 0; padding:16px 20px; border-left:2px solid var(--rift);
    background:linear-gradient(90deg, rgba(130,113,181,0.10), transparent);
    font-style:italic; color:var(--bone-dim); font-size:15.5px;
  }
  #article sup.reference{ font-size:11px; }
  #article sup.reference a{ border-bottom:none; color:var(--toxin); }
  #article .mw-editsection, #article .toc, #article .noprint{ display:none !important; }
  #article hr{ border:none; border-top:1px solid var(--line); margin:30px 0; }

  /* infobox → sidebar-style card. Scoped to BOTH #article (inline infoboxes we
     didn't pull out) and #infoboxSlot (the sidebar, where extracted ones land) —
     these are two separate containers, so both need every rule. */
  #article .portable-infobox, #infoboxSlot .portable-infobox,
  #article .infobox, #infoboxSlot .infobox{
    background:var(--murk) !important; border:1px solid var(--line-strong) !important;
    border-radius:var(--radius); font-family:'Newsreader',serif; color:var(--bone) !important;
    float:none !important; width:100% !important; margin:0 0 30px !important; padding:0 !important;
  }
  #article .pi-title, #infoboxSlot .pi-title,
  #article .infobox caption, #infoboxSlot .infobox caption{
    font-family:'Bricolage Grotesque',sans-serif !important; font-weight:700 !important; font-size:20px !important;
    background:var(--murk-2) !important; color:var(--bone) !important; padding:14px 18px !important; margin:0 !important;
  }
  #article .pi-data, #infoboxSlot .pi-data,
  #article .infobox tr, #infoboxSlot .infobox tr{ border-top:1px solid var(--line) !important; }
  #article .pi-data-label, #infoboxSlot .pi-data-label,
  #article .infobox th, #infoboxSlot .infobox th{
    font-family:'IBM Plex Mono',monospace !important; font-size:10.5px !important; text-transform:uppercase;
    letter-spacing:.03em; color:var(--bone-dim) !important; background:none !important;
  }
  #article .pi-data-value, #infoboxSlot .pi-data-value,
  #article .infobox td, #infoboxSlot .infobox td{ color:var(--bone) !important; background:none !important; }
  #article .pi-item, #infoboxSlot .pi-item,
  #article .infobox td, #infoboxSlot .infobox td,
  #article .infobox th, #infoboxSlot .infobox th{ padding:9px 18px !important; }
  #article .pi-image img, #infoboxSlot .pi-image img,
  #article .infobox img, #infoboxSlot .infobox img{ width:100%; }
  #article .pi-caption, #infoboxSlot .pi-caption{
    font-family:'IBM Plex Mono',monospace !important; font-size:10.5px !important; color:var(--bone-dim) !important;
    padding:8px 18px 0 !important;
  }

  /* ---- Tabbers: image-collection tabs in infoboxes, and content tabbers in
     article bodies. Fandom ships two markup generations; we support both. ---- */

  /* new FandomDesktop skin ("wds-tabber") — used for both infobox image tabs
     and general in-article tabbers */
  .wds-tab__content{ display:none; }
  .wds-tab__content.wds-is-current{ display:block; }
  .wds-tabs__wrapper{ margin:0 0 10px; }
  .wds-tabs{ list-style:none; display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:14px 18px 0; }
  .wds-tabs__tab{
    cursor:pointer; user-select:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:.04em; text-transform:uppercase; padding:6px 12px; border:1px solid var(--line-strong);
    border-radius:100px; color:var(--bone-dim);
  }
  .wds-tabs__tab:hover{ color:var(--bone); border-color:var(--bone-dim); }
  .wds-tabs__tab.wds-is-current{ background:var(--toxin); border-color:var(--toxin); color:var(--void); font-weight:600; }
  .wds-tab__content .pi-image-caption, .wds-tab__content figcaption{ padding:0 18px 14px; }
  .wds-tab__content img{ display:block; padding:0 18px; box-sizing:border-box; }

  /* legacy portable-infobox tabs */
  .pi-image-collection-tab-content{ display:none; }
  .pi-image-collection-tab-content.current{ display:block; }
  ul.pi-image-collection-tabs{
    list-style:none; display:flex; flex-wrap:wrap; gap:6px; margin:0; padding:14px 18px 0;
  }
  ul.pi-image-collection-tabs li{
    cursor:pointer; user-select:none; font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    letter-spacing:.04em; text-transform:uppercase; padding:6px 12px; border:1px solid var(--line-strong);
    border-radius:100px; color:var(--bone-dim);
  }
  ul.pi-image-collection-tabs li:hover{ color:var(--bone); border-color:var(--bone-dim); }
  ul.pi-image-collection-tabs li.current{ background:var(--toxin); border-color:var(--toxin); color:var(--void); font-weight:600; }

  /* legacy generic tabber (Tabber extension used directly in article bodies) */
  .tabber:not(.wds-tabber) > .tabbernav{ list-style:none; display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px; padding:0; }
  .tabber:not(.wds-tabber) > .tabbernav li{
    cursor:pointer; user-select:none; font-family:'IBM Plex Mono',monospace; font-size:11px;
    letter-spacing:.03em; padding:7px 14px; border:1px solid var(--line-strong); border-radius:100px; color:var(--bone-dim);
  }
  .tabber:not(.wds-tabber) > .tabbernav li:hover{ color:var(--bone); border-color:var(--bone-dim); }
  .tabber:not(.wds-tabber) > .tabbernav li.tabberactive{ background:var(--toxin); border-color:var(--toxin); color:var(--void); font-weight:600; }

  .quote-strip{
    display:flex; gap:8px; flex-wrap:wrap; margin:0 0 30px;
  }
  .tag{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; text-transform:uppercase;
    padding:5px 10px; border:1px solid var(--line-strong); border-radius:100px; color:var(--bone-dim);
  }

  .side-panel{
    position:sticky; top:80px; background:var(--murk); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--bone-dim);
  }
  .side-panel .eyebrow{ display:block; margin-bottom:10px; }
  .side-panel .row{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
  .side-panel .row:last-child{ border-bottom:none; }

  /* ---------------- States ---------------- */
  .center-state{
    max-width:480px; margin:0 auto; padding:120px 24px; text-align:center;
  }
  .center-state .eyebrow{ display:block; margin-bottom:14px; }
  .center-state h2{ font-family:'Bricolage Grotesque',sans-serif; font-size:26px; margin:0 0 12px; }
  .center-state p{ color:var(--bone-dim); margin:0 0 24px; }
  .btn{
    display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.03em;
    text-transform:uppercase; padding:11px 22px; border:1px solid var(--toxin); color:var(--toxin);
    border-radius:100px; text-decoration:none; background:none; cursor:pointer;
  }
  .btn:hover{ background:var(--toxin); color:var(--void); }
  .spinner{
    width:26px; height:26px; margin:0 auto 20px; border-radius:50%;
    border:2px solid var(--line-strong); border-top-color:var(--toxin);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width: 980px){
    .layout{ grid-template-columns:1fr; }
    .toc{ display:none; }
  }
  @media (max-width: 640px){
    header{ padding:12px 16px; }
    header .wiki-search{ max-width:none; }
    .home-hero{ padding:70px 18px 40px; }
    .layout{ padding:32px 16px 80px; }
  }
  @media (prefers-reduced-motion: reduce){ html{ scroll-behavior:auto; } * { transition:none !important; } }
</style>
</head>
<body>

<header>
  <button class="wordmark" onclick="location.hash='#/'"><span class="glyph">▚</span> Codex</button>
  <div class="wiki-search" id="headerSearchWrap">
    <input type="text" id="headerSearch" placeholder="Search this wiki…" autocomplete="off">
    <div class="suggest-panel" id="headerSuggest"></div>
  </div>
  <a class="current-wiki" id="currentWikiLink" href="#/" style="display:none"></a>
</header>

<main id="app"></main>

<script>
(function(){

  const app = document.getElementById('app');
  const headerSearchWrap = document.getElementById('headerSearchWrap');
  const headerSearch = document.getElementById('headerSearch');
  const headerSuggest = document.getElementById('headerSuggest');
  const currentWikiLink = document.getElementById('currentWikiLink');

  const CURATED = [
    { sub:'forgottenrealms', name:'Forgotten Realms', blurb:'D&D · Faerûn lore' },
    { sub:'starwars',        name:'Wookieepedia',      blurb:'Star Wars' },
    { sub:'marvel',          name:'Marvel Database',   blurb:'Comics universe' },
    { sub:'harrypotter',     name:'Harry Potter Wiki',  blurb:'Wizarding World' },
    { sub:'warhammer40k',    name:'Warhammer 40k',      blurb:'Grimdark sci-fi' },
    { sub:'elderscrolls',    name:'The Elder Scrolls',  blurb:'Tamriel lore' },
    { sub:'onepiece',        name:'One Piece Wiki',     blurb:'Grand Line' },
    { sub:'gameofthrones',   name:'Game of Thrones',    blurb:'Westeros' },
  ];

  const siteCache = {};   // sub -> siteinfo
  let currentSub = null;

  // ---------- helpers ----------
  function api(sub, params){
    const usp = new URLSearchParams(Object.assign({ format:'json', origin:'*' }, params));
    return `https://${sub}.fandom.com/api.php?${usp.toString()}`;
  }
  async function fetchJSON(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }
  function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function getSiteInfo(sub){
    if(siteCache[sub]) return siteCache[sub];
    const data = await fetchJSON(api(sub, { action:'query', meta:'siteinfo', siprop:'general|statistics' }));
    if(!data.query || !data.query.general) throw new Error('not a wiki');
    const merged = Object.assign({}, data.query.general, {
      articles: data.query.statistics ? data.query.statistics.articles : null
    });
    siteCache[sub] = merged;
    return merged;
  }

  // ---------- routing ----------
  function parseHash(){
    const h = location.hash.replace(/^#\/?/, '');
    const parts = h.split('/').filter(Boolean);
    if(parts[0] === 'w' && parts[1]){
      return { view:'wiki', sub:parts[1], title: parts[2] ? decodeURIComponent(parts.slice(2).join('/')) : null };
    }
    return { view:'home' };
  }

  function route(){
    const r = parseHash();
    if(r.view === 'home'){
      currentSub = null;
      headerSearchWrap.classList.remove('show');
      currentWikiLink.style.display = 'none';
      renderHome();
    } else {
      currentSub = r.sub;
      headerSearchWrap.classList.add('show');
      renderWiki(r.sub, r.title);
    }
  }
  window.addEventListener('hashchange', route);

  // ---------- HOME ----------
  function renderHome(){
    app.innerHTML = `
      <section class="home-hero">
        <h1>Read Fandom<br><span>without the noise.</span></h1>
        <p class="sub">Type a wiki to jump in — same public content, rebuilt with actual typography, no ads, no autoplay video, no forty-item nav menu.</p>
        <div class="home-search">
          <input type="text" id="homeInput" placeholder="Try “forgottenrealms”, “zelda”, “warhammer40k”…" autocomplete="off">
          <div class="hint">Type a wiki's subdomain and press <kbd>Enter</kbd> — e.g. the "x" in x.fandom.com</div>
        </div>
        <div class="home-status" id="homeStatus"></div>
      </section>
      <section class="quickpicks">
        <span class="eyebrow">Or jump into one of these</span>
        <div class="pick-grid" id="pickGrid"></div>
      </section>
      <p class="home-footnote">Pulls live, public content straight from each wiki's own API (the same data Fandom itself serves) and re-renders it here. Not affiliated with Fandom, Inc. Text remains © its original wiki contributors under CC BY-SA.</p>
    `;
    const grid = document.getElementById('pickGrid');
    grid.innerHTML = CURATED.map(w => `
      <button class="pick-card" data-sub="${w.sub}">
        <div class="name">${esc(w.name)}</div>
        <div class="sub">${esc(w.sub)}.fandom.com · ${esc(w.blurb)}</div>
      </button>
    `).join('');
    grid.querySelectorAll('.pick-card').forEach(btn => {
      btn.addEventListener('click', () => { location.hash = `#/w/${btn.dataset.sub}`; });
    });

    const input = document.getElementById('homeInput');
    const status = document.getElementById('homeStatus');
    input.focus();
    input.addEventListener('keydown', async (e) => {
      if(e.key !== 'Enter') return;
      const raw = input.value.trim().toLowerCase();
      if(!raw) return;
      const sub = raw.replace(/^https?:\/\//,'').replace(/\.fandom\.com.*$/,'').replace(/[^a-z0-9-]/g,'');
      if(!sub) return;
      status.className = 'home-status show loading';
      status.textContent = `Checking ${sub}.fandom.com …`;
      try{
        await getSiteInfo(sub);
        location.hash = `#/w/${sub}`;
      }catch(err){
        status.className = 'home-status show';
        status.textContent = `Couldn't find a wiki at ${sub}.fandom.com — check the spelling, or it may have moved off Fandom entirely.`;
      }
    });
  }

  // ---------- WIKI: header in-wiki search ----------
  let suggestAbort = null, hiIndex = -1;
  async function doSuggest(term){
    if(!currentSub || !term){ headerSuggest.classList.remove('show'); return; }
    try{
      if(suggestAbort) suggestAbort.abort();
      suggestAbort = new AbortController();
      const res = await fetch(api(currentSub, { action:'opensearch', search:term, limit:8, namespace:0 }), { signal: suggestAbort.signal });
      const data = await res.json();
      const titles = data[1] || [];
      hiIndex = -1;
      if(!titles.length){ headerSuggest.classList.remove('show'); return; }
      headerSuggest.innerHTML = titles.map((t,i) => `<button class="suggest-item" data-title="${esc(t)}">${esc(t)}</button>`).join('');
      headerSuggest.classList.add('show');
      headerSuggest.querySelectorAll('.suggest-item').forEach(el => {
        el.addEventListener('click', () => {
          headerSuggest.classList.remove('show');
          headerSearch.value = '';
          location.hash = `#/w/${currentSub}/${encodeURIComponent(el.dataset.title)}`;
        });
      });
    }catch(e){ /* aborted or network hiccup — ignore */ }
  }
  let suggestTimer;
  headerSearch.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    const v = headerSearch.value.trim();
    suggestTimer = setTimeout(() => doSuggest(v), 180);
  });
  headerSearch.addEventListener('keydown', (e) => {
    const items = [...headerSuggest.querySelectorAll('.suggest-item')];
    if(e.key === 'ArrowDown'){ e.preventDefault(); hiIndex = Math.min(hiIndex+1, items.length-1); items.forEach((it,i)=>it.classList.toggle('hi', i===hiIndex)); }
    if(e.key === 'ArrowUp'){ e.preventDefault(); hiIndex = Math.max(hiIndex-1, 0); items.forEach((it,i)=>it.classList.toggle('hi', i===hiIndex)); }
    if(e.key === 'Enter'){
      if(hiIndex >= 0 && items[hiIndex]){ items[hiIndex].click(); }
      else if(headerSearch.value.trim()){ location.hash = `#/w/${currentSub}/${encodeURIComponent(headerSearch.value.trim())}`; headerSuggest.classList.remove('show'); headerSearch.value=''; }
    }
    if(e.key === 'Escape'){ headerSuggest.classList.remove('show'); }
  });
  document.addEventListener('click', (e) => {
    if(!headerSearchWrap.contains(e.target)) headerSuggest.classList.remove('show');
  });

  // ---------- WIKI view ----------
  async function renderWiki(sub, title){
    currentWikiLink.style.display = 'inline';
    currentWikiLink.textContent = sub + '.fandom.com';
    currentWikiLink.href = `#/w/${sub}`;

    app.innerHTML = `
      <div class="center-state">
        <div class="spinner"></div>
        <div class="eyebrow">Loading</div>
        <h2>Fetching ${esc(sub)}${title ? ' — ' + esc(title) : ''}…</h2>
      </div>`;

    let info;
    try{
      info = await getSiteInfo(sub);
    }catch(err){
      app.innerHTML = `
        <div class="center-state">
          <div class="eyebrow">Not found</div>
          <h2>No wiki at ${esc(sub)}.fandom.com</h2>
          <p>It may be misspelled, or the community may have moved to an independent site (several popular ones have).</p>
          <a class="btn" href="#/">← Back to search</a>
        </div>`;
      return;
    }

    let parseData;
    try{
      const pageToLoad = title || info.mainpage;
      const params = { action:'parse', page:pageToLoad, prop:'text|sections|displaytitle', redirects:1 };
      parseData = await fetchJSON(api(sub, params));
      if(parseData.error) throw new Error(parseData.error.info || 'page not found');
    }catch(err){
      app.innerHTML = `
        <div class="center-state">
          <div class="eyebrow">Page not found</div>
          <h2>Couldn't load that article</h2>
          <p>${esc(err.message || '')}</p>
          <a class="btn" href="#/w/${esc(sub)}">← ${esc(info.sitename)} home</a>
        </div>`;
      return;
    }

    renderArticle(sub, info, parseData.parse);
  }

  function renderArticle(sub, info, parse){
    const displayTitle = parse.displaytitle ? stripTags(parse.displaytitle) : parse.title;

    // Build a detached DOM to clean up the content before injecting
    const holder = document.createElement('div');
    holder.innerHTML = parse.text['*'];

    holder.querySelectorAll('script,style,.mw-editsection,.noprint,table.toc,#toc,.printfooter,.catlinks').forEach(el => el.remove());
    holder.querySelectorAll('a[href]').forEach(a => {
      const href = a.getAttribute('href');
      if(!href) return;
      if(href.startsWith('/wiki/')){
        const pageTitle = decodeURIComponent(href.replace('/wiki/','').split('#')[0]).replace(/_/g,' ');
        a.setAttribute('href', `#/w/${sub}/${encodeURIComponent(pageTitle)}`);
        a.setAttribute('data-internal', '1');
      } else if(href.startsWith('#')){
        // in-page anchor (e.g. references) — leave as is
      } else if(/^(https?:)?\/\//.test(href)){
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
      }
    });

    // Pull the infobox out if present, to show in the side panel
    let infoboxHTML = '';
    const infobox = holder.querySelector('.portable-infobox, .infobox');
    if(infobox){
      infoboxHTML = infobox.outerHTML;
      infobox.remove();
    }

    // Build TOC from sections
    const sections = (parse.sections || []).filter(s => s.toclevel <= 2);
    const tocHTML = sections.map(s =>
      `<a class="lvl${s.toclevel}" href="#sec-${s.index}">${esc(stripTags(s.line))}</a>`
    ).join('');

    // Tag each heading with matching id for TOC anchors
    holder.querySelectorAll('h2,h3').forEach((h) => {
      const span = h.querySelector('.mw-headline');
      if(span && span.id){
        const match = (parse.sections||[]).find(s => s.anchor === span.id);
        if(match) h.id = `sec-${match.index}`;
      }
    });

    app.innerHTML = `
      <div class="wiki-hero">
        <div class="wiki-hero-inner">
          <div class="breadcrumb"><a href="#/">Codex</a> / <a href="#/w/${esc(sub)}">${esc(info.sitename)}</a></div>
          <h1 class="wiki-title">${displayTitle}</h1>
        </div>
      </div>
      <div class="layout">
        <nav class="toc">
          <span class="eyebrow">On this page</span>
          ${tocHTML || '<span style="color:var(--bone-dim)">No sections</span>'}
        </nav>
        <article id="article"></article>
        <aside class="side-panel">
          <span class="eyebrow">${esc(info.sitename)}</span>
          <div class="row"><span>Articles</span><span>${info.articles != null ? esc(Number(info.articles).toLocaleString()) : '—'}</span></div>
          <div class="row"><span>Language</span><span>${esc(info.lang || '')}</span></div>
          <div id="infoboxSlot"></div>
        </aside>
      </div>
    `;
    document.getElementById('article').appendChild(holder);
    if(infoboxHTML){
      document.getElementById('infoboxSlot').innerHTML = infoboxHTML;
    }
    normalizeTabbers(document.getElementById('article'));
    normalizeTabbers(document.getElementById('infoboxSlot'));

    // intercept internal link clicks (hash already routes, but ensure SPA nav triggers re-render even if hash matches pattern change only)
    document.getElementById('article').addEventListener('click', (e) => {
      const a = e.target.closest('a[data-internal]');
      if(a){
        // let default hash navigation happen; hashchange listener re-renders
      }
    });

    window.scrollTo(0,0);
  }

  // Fandom's tab widgets (image-collection tabs on infoboxes, and general
  // content tabbers) work by hiding all but one panel via JS that never runs
  // here, since we strip <script> tags for safety. So: mark exactly one
  // tab/panel pair "current" per tabber (defaulting to the first if the
  // fetched HTML doesn't already flag one), and index every tab/panel pair
  // so the delegated click handler below can find its match.
  function normalizeTabbers(root){
    root.querySelectorAll('.wds-tabber').forEach(tabber => {
      const tabs = [...tabber.querySelectorAll('.wds-tabs__tab')].filter(t => t.closest('.wds-tabber') === tabber);
      const panels = [...tabber.querySelectorAll(':scope > .wds-tab__content')];
      tabs.forEach((t,i) => t.dataset.tabIndex = i);
      panels.forEach((p,i) => p.dataset.tabIndex = i);
      if(tabs.length && !tabs.some(t => t.classList.contains('wds-is-current'))) tabs[0].classList.add('wds-is-current');
      if(panels.length && !panels.some(p => p.classList.contains('wds-is-current'))) panels[0].classList.add('wds-is-current');
    });
    root.querySelectorAll('.pi-image-collection').forEach(coll => {
      const tabs = [...coll.querySelectorAll(':scope > .pi-image-collection-tabs > li, :scope > ul.pi-image-collection-tabs > li')];
      const panels = [...coll.querySelectorAll(':scope > .pi-image-collection-tab-content')];
      tabs.forEach((t,i) => t.dataset.tabIndex = i);
      panels.forEach((p,i) => p.dataset.tabIndex = i);
      if(tabs.length && !tabs.some(t => t.classList.contains('current'))) tabs[0].classList.add('current');
      if(panels.length && !panels.some(p => p.classList.contains('current'))) panels[0].classList.add('current');
    });
    root.querySelectorAll('.tabber:not(.wds-tabber)').forEach(tabber => {
      const tabs = [...tabber.querySelectorAll(':scope > .tabbernav > li')];
      const panels = [...tabber.querySelectorAll(':scope > .tabbertab')];
      tabs.forEach((t,i) => t.dataset.tabIndex = i);
      panels.forEach((p,i) => { p.dataset.tabIndex = i; p.style.display = i === 0 ? '' : 'none'; });
      if(tabs.length) tabs[0].classList.add('tabberactive');
    });
  }

  // One delegated listener handles every tabber on the page, present or future
  // (article re-renders replace #article's contents, but this listener lives
  // on document and never needs to be re-attached).
  document.addEventListener('click', (e) => {
    const wdsTab = e.target.closest('.wds-tabs__tab');
    if(wdsTab){
      e.preventDefault();
      const tabber = wdsTab.closest('.wds-tabber');
      if(!tabber) return;
      const idx = wdsTab.dataset.tabIndex;
      tabber.querySelectorAll('.wds-tabs__tab').forEach(t => { if(t.closest('.wds-tabber') === tabber) t.classList.remove('wds-is-current'); });
      tabber.querySelectorAll(':scope > .wds-tab__content').forEach(p => p.classList.remove('wds-is-current'));
      wdsTab.classList.add('wds-is-current');
      const panel = tabber.querySelector(`:scope > .wds-tab__content[data-tab-index="${idx}"]`);
      if(panel) panel.classList.add('wds-is-current');
      return;
    }
    const piTab = e.target.closest('.pi-image-collection-tabs li');
    if(piTab){
      e.preventDefault();
      const coll = piTab.closest('.pi-image-collection');
      if(!coll) return;
      const idx = piTab.dataset.tabIndex;
      coll.querySelectorAll('.pi-image-collection-tabs li').forEach(t => t.classList.remove('current'));
      coll.querySelectorAll(':scope > .pi-image-collection-tab-content').forEach(p => p.classList.remove('current'));
      piTab.classList.add('current');
      const panel = coll.querySelector(`:scope > .pi-image-collection-tab-content[data-tab-index="${idx}"]`);
      if(panel) panel.classList.add('current');
      return;
    }
    const legacyTab = e.target.closest('.tabber:not(.wds-tabber) > .tabbernav > li');
    if(legacyTab){
      e.preventDefault();
      const tabber = legacyTab.closest('.tabber');
      if(!tabber) return;
      const idx = legacyTab.dataset.tabIndex;
      tabber.querySelectorAll(':scope > .tabbernav > li').forEach(t => t.classList.remove('tabberactive'));
      legacyTab.classList.add('tabberactive');
      tabber.querySelectorAll(':scope > .tabbertab').forEach(p => { p.style.display = (p.dataset.tabIndex === idx) ? '' : 'none'; });
    }
  });

  function stripTags(html){
    const d = document.createElement('div');
    d.innerHTML = html;
    return d.textContent || '';
  }

  // ---------- boot ----------
  route();
})();
</script>
</body>
</html>
